<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cannon-es Crane Game</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { display: block; }
    #ui {
      position: fixed; left: 16px; top: 16px; z-index: 10;
      padding: 12px 14px; border-radius: 12px;
      background: rgba(0,0,0,.58); color: #fff; line-height: 1.45;
      backdrop-filter: blur(8px); user-select: none;
    }
    #ui b { font-size: 16px; }
    #state { color: #9ee7ff; }
    #score { color: #ffe082; }
    #hint { opacity: .75; font-size: 12px; }
  </style>
</head>
<body>
  <div id="ui">
    <b>cannon-es Crane Game</b><br>
    移動: WASD / 矢印キー<br>
    Space: アーム動作 / 景品を離す<br>
    状態: <span id="state">READY</span><br>
    SCORE: <span id="score">0</span><br>
    <span id="hint"></span>
  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.179.1';
    import * as CANNON from 'https://esm.sh/cannon-es@0.20.0';
    import { mountClefDemo } from './clef-demo.js';

    const requestedArm = new URLSearchParams(location.search).get('arm');
    const armType = ['three', 'two', 'scoop'].includes(requestedArm) ? requestedArm : 'three';
    const isScoop = armType === 'scoop';
    const fingerCount = isScoop ? 0 : armType === 'two' ? 2 : 3;
    document.querySelector('#hint').textContent = isScoop
      ? '板状ヘラを垂直に回転させてから下げ、水平姿勢へ回転復帰して景品をすくいます。解放時は板を傾けて支えを外します'
      : `${fingerCount}本爪は動的剛体＋ヒンジモーター。景品を物理的に押し返します`;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x16181d);

    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(10, 9, 12);
    camera.lookAt(0, 2.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- Top-down orthographic camera (model capture only) ----------------
    // Clef gets a second, straight-down frame alongside the oblique one: the
    // main view's elevated hub/prize (topY ~6.15) parallaxes against the
    // ground-level tray under a perspective camera, which is a prime suspect
    // for the observed grab/release oscillation. Orthographic + top-down
    // removes that height-dependent offset entirely. Reused every capture;
    // never touches the on-screen oblique `camera`/`renderer.render(scene, camera)`
    // path.
    const TOPDOWN_HALF_X = 5.3;
    const TOPDOWN_HALF_Z = 4.3;
    const topDownCamera = new THREE.OrthographicCamera(-TOPDOWN_HALF_X, TOPDOWN_HALF_X, TOPDOWN_HALF_Z, -TOPDOWN_HALF_Z, 0.1, 50);
    // up = world -Z so the projected screen axes read: up=-Z (W/forward),
    // down=+Z (S/back), right=+X (D), left=-X (A) -- see derivation in capture().
    topDownCamera.up.set(0, 0, -1);
    topDownCamera.position.set(0, 22, 0);
    topDownCamera.lookAt(0, 0, 0);

    function updateTopDownFrustum() {
      const aspect = innerWidth / innerHeight;
      const requiredAspect = TOPDOWN_HALF_X / TOPDOWN_HALF_Z;
      let halfX = TOPDOWN_HALF_X;
      let halfZ = TOPDOWN_HALF_Z;
      if (aspect > requiredAspect) halfX = TOPDOWN_HALF_Z * aspect;
      else halfZ = TOPDOWN_HALF_X / aspect;
      topDownCamera.left = -halfX;
      topDownCamera.right = halfX;
      topDownCamera.top = halfZ;
      topDownCamera.bottom = -halfZ;
      topDownCamera.updateProjectionMatrix();
    }

    scene.add(new THREE.HemisphereLight(0xffffff, 0x31333a, 2.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.3);
    sun.position.set(6, 12, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    world.allowSleep = true;
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.solver.iterations = 36;
    world.solver.tolerance = 0.001;

    const prizeMaterial = new CANNON.Material('prize');
    const clawMaterial = new CANNON.Material('claw');
    world.addContactMaterial(new CANNON.ContactMaterial(prizeMaterial, prizeMaterial, {
      friction: 0.45,
      restitution: 0.12,
      contactEquationStiffness: 1e7,
      contactEquationRelaxation: 3,
    }));
    world.addContactMaterial(new CANNON.ContactMaterial(clawMaterial, prizeMaterial, {
      friction: 1.8,
      restitution: 0.02,
      contactEquationStiffness: 2e7,
      contactEquationRelaxation: 2,
      frictionEquationStiffness: 2e7,
      frictionEquationRelaxation: 2,
    }));
    world.defaultContactMaterial.friction = 0.5;
    world.defaultContactMaterial.restitution = 0.08;

    const dynamicObjects = [];
    const prizes = [];
    const prizeByBody = new Map();
    const fingerIndexByBody = new Map();

    function addStaticBox(size, position, color, opacity = 1) {
      const [sx, sy, sz] = size;
      const [x, y, z] = position;

      const body = new CANNON.Body({ mass: 0, material: prizeMaterial });
      body.addShape(new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)));
      body.position.set(x, y, z);
      world.addBody(body);

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        new THREE.MeshStandardMaterial({ color, transparent: opacity < 1, opacity })
      );
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      scene.add(mesh);
      return { body, mesh };
    }

    // Cabinet floor and walls.
    addStaticBox([10, 0.5, 8], [0, -0.25, 0], 0x2a2d35);
    addStaticBox([10, 1.3, 0.25], [0, 0.65, -4], 0x3a3f48, 0.85);
    addStaticBox([0.25, 1.3, 8], [-5, 0.65, 0], 0x3a3f48, 0.85);
    addStaticBox([0.25, 1.3, 8], [5, 0.65, 0], 0x3a3f48, 0.85);
    addStaticBox([10, 0.45, 0.25], [0, 0.225, 4], 0x3a3f48, 0.85);

    // Prize tray / target zone.
    addStaticBox([2.4, 0.16, 2.0], [3.55, 0.08, 2.8], 0x1f6f50);
    addStaticBox([2.4, 0.55, 0.12], [3.55, 0.275, 3.75], 0x2f946e);
    addStaticBox([0.12, 0.55, 2.0], [4.69, 0.275, 2.8], 0x2f946e);
    addStaticBox([0.12, 0.55, 2.0], [2.41, 0.275, 2.8], 0x2f946e);

    const trayLabel = document.createElement('canvas');
    trayLabel.width = 256;
    trayLabel.height = 64;
    const ctx = trayLabel.getContext('2d');
    ctx.fillStyle = '#1f6f50';
    ctx.fillRect(0, 0, 256, 64);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('DROP ZONE', 128, 32);
    const labelTex = new THREE.CanvasTexture(trayLabel);
    const label = new THREE.Mesh(
      new THREE.PlaneGeometry(2.2, 0.55),
      new THREE.MeshBasicMaterial({ map: labelTex, transparent: true })
    );
    label.position.set(3.55, 0.7, 3.88);
    label.rotation.x = -Math.PI / 2.8;
    scene.add(label);

    const palette = [0xff5f6d, 0xffc857, 0x5ac8fa, 0x9b7bff, 0x6ee7a8, 0xff8de1];

    // Convex polyhedron builder shared by the cone (many segments) and the
    // tetrahedron (3 segments == triangular pyramid). Apex sits at local
    // +y height/2, base circle/polygon at local -y height/2 -- the same
    // axis convention as THREE's ConeGeometry/CylinderGeometry, so meshes
    // and cannon-es hulls need no extra rotation to line up. This winding
    // ([apex, baseNext, basePrev] per side face, forward-order base fan) is
    // verified to produce outward-facing normals for both
    // CANNON.ConvexPolyhedron (no "points into the shape" warning) and a
    // THREE.BufferGeometry built from the same vertex/face order.
    function conePoints(radius, height, segments) {
      const apex = [0, height / 2, 0];
      const base = [];
      for (let i = 0; i < segments; i++) {
        const theta = (2 * Math.PI / segments) * i;
        base.push([radius * Math.cos(theta), -height / 2, radius * Math.sin(theta)]);
      }
      return { apex, base };
    }

    function coneConvexShape(radius, height, segments) {
      const { apex, base } = conePoints(radius, height, segments);
      const vertices = [new CANNON.Vec3(...apex), ...base.map((p) => new CANNON.Vec3(...p))];
      const faces = [];
      for (let i = 0; i < segments; i++) faces.push([0, 1 + ((i + 1) % segments), 1 + i]);
      faces.push(base.map((_, i) => 1 + i));
      return new CANNON.ConvexPolyhedron({ vertices, faces });
    }

    function coneBufferGeometry(radius, height, segments) {
      const { apex, base } = conePoints(radius, height, segments);
      const tris = [];
      for (let i = 0; i < segments; i++) {
        const b = base[i], c = base[(i + 1) % segments];
        tris.push(apex, c, b);
      }
      for (let i = 1; i < segments - 1; i++) tris.push(base[0], base[i], base[i + 1]);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
      geo.computeVertexNormals();
      return geo;
    }

    // Nominal (scale 1) size per shape type; every prize gets an independent
    // random 0.7..1.15 scale applied uniformly to its dimensions, so sizes
    // vary while the mesh, cannon-es body and the observe() shape descriptor
    // (consumed verbatim via item.shape) always agree on actual dimensions.
    const SHAPE_TYPES = ['sphere', 'box', 'cone', 'tetrahedron', 'cylinder'];
    const BASE_MASS = 0.72;

    function buildShape(type, scale) {
      if (type === 'sphere') {
        const radius = 0.42 * scale;
        return {
          cannonShape: new CANNON.Sphere(radius),
          geometry: new THREE.SphereGeometry(radius, 24, 18),
          descriptor: { type: 'sphere', radius },
          boundingRadius: radius,
        };
      }
      if (type === 'box') {
        const h = 0.38 * scale;
        return {
          cannonShape: new CANNON.Box(new CANNON.Vec3(h, h, h)),
          geometry: new THREE.BoxGeometry(h * 2, h * 2, h * 2),
          descriptor: { type: 'box', half_extents: [h, h, h] },
          boundingRadius: h * Math.sqrt(3),
        };
      }
      if (type === 'cone') {
        const radius = 0.42 * scale;
        const height = 0.9 * scale;
        const segments = 16;
        return {
          cannonShape: coneConvexShape(radius, height, segments),
          geometry: coneBufferGeometry(radius, height, segments),
          descriptor: { type: 'cone', radius, height },
          boundingRadius: Math.hypot(radius, height / 2),
        };
      }
      if (type === 'tetrahedron') {
        const radius = 0.46 * scale;
        const height = 0.82 * scale;
        return {
          cannonShape: coneConvexShape(radius, height, 3),
          geometry: coneBufferGeometry(radius, height, 3),
          descriptor: { type: 'tetrahedron', radius, height },
          boundingRadius: Math.hypot(radius, height / 2),
        };
      }
      // cylinder: CANNON.Cylinder and THREE.CylinderGeometry both build
      // around the local +y axis, so no rotation is needed to align them.
      const radius = 0.36 * scale;
      const height = 0.78 * scale;
      const segments = 16;
      return {
        cannonShape: new CANNON.Cylinder(radius, radius, height, segments),
        geometry: new THREE.CylinderGeometry(radius, radius, height, segments),
        descriptor: { type: 'cylinder', radius, height },
        boundingRadius: Math.hypot(radius, height / 2),
      };
    }

    function addPrize(i) {
      const type = SHAPE_TYPES[i % SHAPE_TYPES.length];
      const scale = 0.7 + Math.random() * 0.45;
      const color = palette[i % palette.length];
      const { cannonShape, geometry, descriptor, boundingRadius } = buildShape(type, scale);

      const x = -3.7 + (i % 4) * 1.4 + (Math.random() - 0.5) * 0.25;
      const z = -2.5 + Math.floor(i / 4) * 1.3 + (Math.random() - 0.5) * 0.25;
      // Spawn height is derived from this prize's own bounding radius (max
      // vertex distance from its center, rotation-invariant) so even the
      // largest tilted shape at 1.15x scale clears the floor (y=0) with
      // margin; the upper layer offset (1.6) exceeds the largest possible
      // diameter so it never spawns inside the lower layer.
      const y = boundingRadius + 0.05 + Math.floor(i / 8) * 1.6;

      const body = new CANNON.Body({ mass: BASE_MASS * scale ** 3, material: prizeMaterial });
      body.linearDamping = 0.08;
      body.angularDamping = 0.12;
      body.allowSleep = true;
      body.sleepSpeedLimit = 0.12;
      body.sleepTimeLimit = 0.7;
      body.addShape(cannonShape);
      body.position.set(x, y, z);
      body.quaternion.setFromEuler(Math.random() * 0.2, Math.random() * Math.PI, Math.random() * 0.2);
      world.addBody(body);

      const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color, roughness: 0.6 }));
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const item = { body, mesh, scored: false, shape: descriptor };
      prizes.push(item);
      prizeByBody.set(body, item);
      dynamicObjects.push(item);
    }

    for (let i = 0; i < 12; i++) addPrize(i);

    // Gantry rails.
    const railMat = new THREE.MeshStandardMaterial({ color: 0xcfd6df, metalness: 0.55, roughness: 0.35 });
    function rail(size, pos) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), railMat);
      mesh.position.set(...pos);
      mesh.castShadow = true;
      scene.add(mesh);
      return mesh;
    }
    rail([9.2, 0.14, 0.14], [0, 7.0, -3.3]);
    rail([9.2, 0.14, 0.14], [0, 7.0, 3.3]);
    const bridge = rail([0.16, 0.16, 6.6], [0, 6.88, 0]);

    const carriage = new THREE.Mesh(
      new THREE.BoxGeometry(0.78, 0.30, 0.78),
      new THREE.MeshStandardMaterial({ color: 0xe84a5f, metalness: 0.28, roughness: 0.38 })
    );
    carriage.position.y = 6.9;
    carriage.castShadow = true;
    scene.add(carriage);

    const cable = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.025, 1, 8),
      new THREE.MeshStandardMaterial({ color: 0x20242b, metalness: 0.3, roughness: 0.5 })
    );
    scene.add(cable);

    // Physical claw.
    //
    // The head is kinematic because the gantry/cable prescribes its translation.
    // Each finger, however, is a *dynamic* rigid body attached to the head by a
    // real cannon-es HingeConstraint.  A hinge motor opens/closes the finger.
    // This is crucial: rotating a KINEMATIC finger by directly overwriting its
    // quaternion can teleport the collider through a sleeping prize between solver
    // passes.  Dynamic hinged fingers participate in the contact solver and are
    // therefore stopped/deflected by prizes instead of passing through them.
    const CLAW_GROUP = 2;
    const WORLD_GROUP = 1;

    const topY = 6.15;
    const bottomY = 1.55;
    const openAngle = 0.72;
    const closedAngle = 0.53;   // motor keeps preload when an object blocks closure
    const releaseAngle = 0.90;

    const hubBody = new CANNON.Body({
      mass: 0,
      type: CANNON.Body.KINEMATIC,
      material: clawMaterial,
      collisionFilterGroup: CLAW_GROUP,
      collisionFilterMask: WORLD_GROUP,
    });
    // Approximate the visible yellow head with compound boxes.  It is deliberately
    // a little conservative (slightly larger) so the visible shell never enters a prize.
    hubBody.addShape(new CANNON.Box(new CANNON.Vec3(0.34, 0.23, 0.34)));
    hubBody.addShape(
      new CANNON.Box(new CANNON.Vec3(0.16, 0.16, 0.16)),
      new CANNON.Vec3(0, 0.29, 0)
    );
    hubBody.position.set(0, topY, 0);
    world.addBody(hubBody);

    const hubMesh = new THREE.Group();
    const hubShell = new THREE.Mesh(
      new THREE.CylinderGeometry(0.27, 0.36, 0.44, 20),
      new THREE.MeshStandardMaterial({ color: 0xffd54f, metalness: 0.25, roughness: 0.42 })
    );
    hubShell.castShadow = true;
    hubMesh.add(hubShell);

    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.14, 0.14, 0.18, 16),
      new THREE.MeshStandardMaterial({ color: 0x363b44, metalness: 0.6, roughness: 0.3 })
    );
    collar.position.y = 0.29;
    collar.castShadow = true;
    hubMesh.add(collar);
    scene.add(hubMesh);
    // Flat crosshair placed at the hub's live XZ position, shown only in the
    // top-down capture (see hideArmForTopDownCapture()) while the hub/finger/
    // cable/bridge/carriage meshes are hidden, so the model still has a claw
    // reference point even though the hardware that would otherwise occlude a
    // held prize is not drawn. No physics body; purely a capture-time visual.
    const clawMarker = new THREE.Group();
    const clawMarkerRing = new THREE.Mesh(
      new THREE.RingGeometry(0.22, 0.3, 24),
      new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, depthTest: false, depthWrite: false })
    );
    clawMarkerRing.rotation.x = -Math.PI / 2;
    clawMarkerRing.renderOrder = 1;
    clawMarker.add(clawMarkerRing);
    const clawMarkerDot = new THREE.Mesh(
      new THREE.CircleGeometry(0.07, 16),
      new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, depthWrite: false })
    );
    clawMarkerDot.rotation.x = -Math.PI / 2;
    clawMarkerDot.renderOrder = 1;
    clawMarker.add(clawMarkerDot);
    clawMarker.visible = false;
    scene.add(clawMarker);

    const fingerMat = new THREE.MeshStandardMaterial({
      color: 0xd9dee7,
      metalness: 0.72,
      roughness: 0.24,
    });
    const padMat = new THREE.MeshStandardMaterial({
      color: 0x3b4048,
      metalness: 0.15,
      roughness: 0.8,
    });

    // cannon-es integrates KINEMATIC bodies from velocity.  The hub is placed at
    // the pose used for narrowphase and supplied with velocity for realistic contact
    // relative velocity; after each step it is restored to the prescribed cable pose.
    const kinematicTargets = new Map();

    function rememberKinematicTarget(body) {
      let target = kinematicTargets.get(body);
      if (!target) {
        target = {
          position: new CANNON.Vec3(),
          quaternion: new CANNON.Quaternion(),
        };
        kinematicTargets.set(body, target);
      }
      target.position.copy(body.position);
      target.quaternion.copy(body.quaternion);
      body.aabbNeedsUpdate = true;
    }

    function restoreKinematicTargets() {
      for (const [body, target] of kinematicTargets) {
        body.position.copy(target.position);
        body.quaternion.copy(target.quaternion);
        body.velocity.set(0, 0, 0);
        body.angularVelocity.set(0, 0, 0);
        body.aabbNeedsUpdate = true;
      }
    }

    const fingers = [];
    const tmpQYaw = new CANNON.Quaternion();
    const tmpQTilt = new CANNON.Quaternion();
    const tmpQStart = new CANNON.Quaternion();
    const tmpQInvYaw = new CANNON.Quaternion();
    const tmpQRel = new CANNON.Quaternion();
    const cannonAxisY = new CANNON.Vec3(0, 1, 0);
    const cannonAxisZ = new CANNON.Vec3(0, 0, 1);

    for (let i = 0; i < fingerCount; i++) {
      const yaw = i * Math.PI * 2 / fingerCount;
      const body = new CANNON.Body({
        mass: 0.42,
        type: CANNON.Body.DYNAMIC,
        material: clawMaterial,
        collisionFilterGroup: CLAW_GROUP,
        collisionFilterMask: WORLD_GROUP,
        allowSleep: false,
      });
      body.linearDamping = 0.18;
      body.angularDamping = 0.72;

      // Compound collider exactly mirrors the three visible pieces.
      const upper = new CANNON.Box(new CANNON.Vec3(0.075, 0.43, 0.085));
      body.addShape(upper, new CANNON.Vec3(0, -0.45, 0));

      const hookRot = new CANNON.Quaternion();
      hookRot.setFromAxisAngle(cannonAxisZ, -0.86);
      const hook = new CANNON.Box(new CANNON.Vec3(0.07, 0.29, 0.09));
      body.addShape(hook, new CANNON.Vec3(-0.20, -0.90, 0), hookRot);

      const pad = new CANNON.Box(new CANNON.Vec3(0.11, 0.11, 0.12));
      body.addShape(pad, new CANNON.Vec3(-0.43, -1.08, 0));

      // Initial pose: body origin is the mechanical hinge pivot.
      const radialX = Math.cos(yaw);
      const radialZ = -Math.sin(yaw);
      body.position.set(
        hubBody.position.x + radialX * 0.24,
        hubBody.position.y - 0.08,
        hubBody.position.z + radialZ * 0.24
      );
      tmpQYaw.setFromAxisAngle(cannonAxisY, yaw);
      tmpQTilt.setFromAxisAngle(cannonAxisZ, openAngle);
      tmpQYaw.mult(tmpQTilt, tmpQStart);
      body.quaternion.copy(tmpQStart);
      world.addBody(body);
      fingerIndexByBody.set(body, i);

      // The hinge axis is tangential around the claw.  axisA is expressed in the
      // unrotated hub frame; axisB is local +Z of each finger body.
      const axisA = new CANNON.Vec3(Math.sin(yaw), 0, Math.cos(yaw));
      const pivotA = new CANNON.Vec3(radialX * 0.24, -0.08, radialZ * 0.24);
      const hinge = new CANNON.HingeConstraint(hubBody, body, {
        pivotA,
        pivotB: new CANNON.Vec3(0, 0, 0),
        axisA,
        axisB: new CANNON.Vec3(0, 0, 1),
        collideConnected: false,
        maxForce: 2e5,
      });
      hinge.enableMotor();
      hinge.setMotorMaxForce(18);
      world.addConstraint(hinge);

      const mesh = new THREE.Group();
      const upperMesh = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.86, 0.17), fingerMat);
      upperMesh.position.set(0, -0.45, 0);
      upperMesh.castShadow = true;
      mesh.add(upperMesh);

      const hookMesh = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.58, 0.18), fingerMat);
      hookMesh.position.set(-0.20, -0.90, 0);
      hookMesh.rotation.z = -0.86;
      hookMesh.castShadow = true;
      mesh.add(hookMesh);

      const padMesh = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.24), padMat);
      padMesh.position.set(-0.43, -1.08, 0);
      padMesh.castShadow = true;
      mesh.add(padMesh);
      scene.add(mesh);

      // qYaw is constant and is also used to recover the actual hinge angle.
      const yawQ = new CANNON.Quaternion();
      yawQ.setFromAxisAngle(cannonAxisY, yaw);
      fingers.push({ body, mesh, yaw, yawQ, hinge });
    }

    // A powered rotating scoop: a thin, bent (く-shaped) blade on a single
    // Z-axis pivot. It rotates to a vertical insertion pose before the gantry
    // ever lowers, holds that pose through the descent, then rotates back to
    // the horizontal scooping pose -- sweeping the shallow-arced leading/
    // bottom edge underneath a resting prize purely through rotation. The
    // gantry itself never translates horizontally during the sequence.
    // Only collision/friction supports a prize, never a spring or constraint.
    let scoopBody = null;
    let scoopMesh = null;
    let scoopAngle = 0;
    let supportedPrize = null;
    const scoopLocal = new CANNON.Vec3();
    const scoopUp = new CANNON.Vec3();
    const scoopInsertAngle = -Math.PI / 2; // insertion orientation, held through descent
    const scoopDumpAngle = -Math.PI / 2; // release: rotate -90 deg from the scooping pose (empty), clearing contact support
    const scoopAngularSpeed = 2.0; // rad/s, continuous (never teleported)
    // Vertical gap between the hub and the pivot (the elbow). Small: the
    // blade's own length (tip radius ~1.42 from the pivot) is what reaches
    // the floor when rotated vertical, not a long drop from the hub.
    const scoopPivotDrop = 0.097;
    if (isScoop) {
      const scoopMaterial = new CANNON.Material('scoop');
      world.addContactMaterial(new CANNON.ContactMaterial(prizeMaterial, scoopMaterial, {
        friction: 0.02, restitution: 0,
      }));
      scoopBody = new CANNON.Body({
        mass: 0, type: CANNON.Body.KINEMATIC, material: scoopMaterial,
        collisionFilterGroup: CLAW_GROUP, collisionFilterMask: WORLD_GROUP,
      });

      // A compound convex hull built from a few flat trapezoidal segments can
      // approximate a smooth concave arc that a single convex shape cannot.
      // hexSegmentGeometry builds a full-thickness-to-full-thickness segment
      // (xA < xB); wedgeSegmentGeometry tapers the far (xEdge > xFull) end to
      // a true zero-thickness line, used once for the sharp leading edge.
      function hexSegmentGeometry(xA, yBA, yTA, xB, yBB, yTB, zHalf) {
        const verts = [
          [xA, yBA, -zHalf], [xB, yBB, -zHalf], [xB, yTB, -zHalf], [xA, yTA, -zHalf],
          [xA, yBA, zHalf], [xB, yBB, zHalf], [xB, yTB, zHalf], [xA, yTA, zHalf],
        ];
        const faces = [
          [0, 3, 2, 1], [4, 5, 6, 7], [0, 1, 5, 4], [1, 2, 6, 5], [3, 7, 6, 2], [0, 4, 7, 3],
        ];
        return { verts, faces };
      }
      function wedgeSegmentGeometry(xFull, yBottomFull, yTopFull, xEdge, yEdge, zHalf) {
        const verts = [
          [xEdge, yEdge, -zHalf], [xFull, yBottomFull, -zHalf], [xFull, yTopFull, -zHalf],
          [xEdge, yEdge, zHalf], [xFull, yBottomFull, zHalf], [xFull, yTopFull, zHalf],
        ];
        const faces = [[1, 2, 0], [5, 4, 3], [3, 4, 1, 0], [4, 5, 2, 1], [2, 5, 3, 0]];
        return { verts, faces };
      }
      function addBladeSegment(geom) {
        // Cannon expects each convex shape's own origin inside its hull.
        // Keep the blade pivot separate by attaching centered hulls at offsets.
        const center = new CANNON.Vec3();
        for (const vertex of geom.verts) {
          center.x += vertex[0] / geom.verts.length;
          center.y += vertex[1] / geom.verts.length;
          center.z += vertex[2] / geom.verts.length;
        }
        scoopBody.addShape(new CANNON.ConvexPolyhedron({
          vertices: geom.verts.map(v => new CANNON.Vec3(
            v[0] - center.x, v[1] - center.y, v[2] - center.z,
          )),
          faces: geom.faces,
        }), center);
        const positions = [];
        for (const face of geom.faces) {
          for (let i = 1; i < face.length - 1; i++) {
            positions.push(...geom.verts[face[0]], ...geom.verts[face[i]], ...geom.verts[face[i + 1]]);
          }
        }
        return positions;
      }

      // Blade centerline control points, local to the pivot (the elbow sits
      // at `elbow`). The bottom profile dips then rises again -- a shallow
      // bowl -- and both half-thickness and height taper toward the tip,
      // which has zero thickness: a real sharp leading edge. Every point's
      // |y| stays well past the largest prize radius (~0.483) so the
      // vertical insertion pose descends clear beside a resting prize
      // instead of clipping it; only the subsequent rotation sweeps the
      // blade in under it.
      const bladeZHalf = 0.52;
      const elbow = { x: 0.25, y: -0.72, half: 0.05 };
      const bladeDip = { x: 0.65, y: -0.85, half: 0.045 };
      const bladeRise = { x: 1.00, y: -0.78, half: 0.03 };
      const bladeTip = { x: 1.25, y: -0.68 };

      const seg1 = addBladeSegment(hexSegmentGeometry(
        elbow.x, elbow.y - elbow.half, elbow.y + elbow.half,
        bladeDip.x, bladeDip.y - bladeDip.half, bladeDip.y + bladeDip.half,
        bladeZHalf,
      ));
      const seg2 = addBladeSegment(hexSegmentGeometry(
        bladeDip.x, bladeDip.y - bladeDip.half, bladeDip.y + bladeDip.half,
        bladeRise.x, bladeRise.y - bladeRise.half, bladeRise.y + bladeRise.half,
        bladeZHalf,
      ));
      const seg3 = addBladeSegment(wedgeSegmentGeometry(
        bladeRise.x, bladeRise.y - bladeRise.half, bladeRise.y + bladeRise.half,
        bladeTip.x, bladeTip.y,
        bladeZHalf,
      ));

      // The bent elbow/handle (く-shaped): a single rigid link from the pivot
      // (the body origin) out to the blade root, visibly kinked relative to
      // the blade's own forward direction.
      const handleHalfLen = Math.hypot(elbow.x, elbow.y) / 2;
      const handleHalfThick = 0.05;
      const handleHalfWidth = 0.16;
      const handleAngle = Math.atan2(elbow.y, elbow.x);
      const handleOffset = new CANNON.Vec3(elbow.x / 2, elbow.y / 2, 0);
      const handleOrientation = new CANNON.Quaternion();
      handleOrientation.setFromAxisAngle(cannonAxisZ, handleAngle);
      scoopBody.addShape(
        new CANNON.Box(new CANNON.Vec3(handleHalfLen, handleHalfThick, handleHalfWidth)),
        handleOffset, handleOrientation,
      );

      scoopBody.position.set(0, topY - scoopPivotDrop, 0);
      scoopBody.quaternion.setFromAxisAngle(cannonAxisZ, scoopAngle);
      world.addBody(scoopBody);

      const plateGeometry = new THREE.BufferGeometry();
      plateGeometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute([...seg1, ...seg2, ...seg3], 3),
      );
      plateGeometry.computeVertexNormals();
      scoopMesh = new THREE.Mesh(plateGeometry, fingerMat);
      scoopMesh.castShadow = true;
      scoopMesh.receiveShadow = true;

      const handleMesh = new THREE.Mesh(
        new THREE.BoxGeometry(handleHalfLen * 2, handleHalfThick * 2, handleHalfWidth * 2),
        fingerMat,
      );
      handleMesh.position.copy(handleOffset);
      handleMesh.quaternion.copy(handleOrientation);
      handleMesh.castShadow = true;
      scoopMesh.add(handleMesh);

      scene.add(scoopMesh);
      dynamicObjects.push({ body: scoopBody, mesh: scoopMesh });
    }

    function updateScoop(dt) {
      if (!scoopBody) return;
      const oldAngle = scoopAngle;
      // Rotate to the insertion pose before any descent, hold it through the
      // descent, then rotate back to the level scooping pose during closing;
      // squeezing/raising/carrying all retain that level (0) pose; release
      // tilts to clear contact support. The gantry (x/y/z) is driven
      // entirely by moveHub; only the angle is owned here.
      const insertionPhase = ['preopen', 'descending', 'settling'].includes(state);
      const angleTarget = state === 'releasing' ? scoopDumpAngle : insertionPhase ? scoopInsertAngle : 0;
      scoopAngle = moveToward(scoopAngle, angleTarget, scoopAngularSpeed, dt);
      scoopBody.position.set(hubBody.position.x, hubBody.position.y - scoopPivotDrop, hubBody.position.z);
      scoopBody.velocity.copy(hubBody.velocity);
      scoopBody.quaternion.setFromAxisAngle(cannonAxisZ, scoopAngle);
      scoopBody.angularVelocity.set(0, 0, (scoopAngle - oldAngle) / dt);
      rememberKinematicTarget(scoopBody);
      // Cannon treats sleeping-prize/kinematic contacts as overlap-only.
      // Wake intersecting prizes so the real blade contact can lift them.
      scoopBody.updateAABB();
      for (const prize of prizes) {
        if (prize.body.sleepState !== CANNON.Body.SLEEPING) continue;
        if (prize.body.aabbNeedsUpdate) prize.body.updateAABB();
        if (scoopBody.aabb.overlaps(prize.body.aabb)) prize.body.wakeUp();
      }
    }

    function updateScoopSupport() {
      supportedPrize = null;
      if (!scoopBody || !['raising', 'carrying'].includes(state)) return;
      scoopBody.quaternion.vmult(cannonAxisY, scoopUp);
      for (const contact of world.contacts) {
        if (contact.enabled === false) continue;
        const plateIsA = contact.bi === scoopBody;
        if (!plateIsA && contact.bj !== scoopBody) continue;
        const prize = prizeByBody.get(plateIsA ? contact.bj : contact.bi);
        if (!prize || prize.scored) continue;
        const upward = contact.ni.dot(scoopUp) * (plateIsA ? 1 : -1);
        if (upward < 0.5) continue;
        scoopBody.pointToLocalFrame(prize.body.position, scoopLocal);
        // Bounds of the bent blade+handle in its own local frame (blade
        // spans x~0.25..1.25, bottom profile y~-0.9..-0.68, width z~+-0.52;
        // the lower y bound is relaxed below the deepest bowl point so a
        // resting prize's own center, not just its contact point, still
        // qualifies).
        if (scoopLocal.x < -0.3 || scoopLocal.x > 1.45 || Math.abs(scoopLocal.z) > 0.65 ||
            scoopLocal.y < -1.0 || scoopLocal.y > 0.2) continue;
        supportedPrize = prize;
        break;
      }
    }

    function heldPrize() {
      return isScoop ? supportedPrize : grip?.prize ?? null;
    }

    function normalizedAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function getFingerAngle(f) {
      // qFinger = qYaw * qTilt, so qTilt = inverse(qYaw) * qFinger.
      f.yawQ.conjugate(tmpQInvYaw);
      tmpQInvYaw.mult(f.body.quaternion, tmpQRel);
      return normalizedAngle(2 * Math.atan2(tmpQRel.z, tmpQRel.w));
    }

    function getAverageFingerAngle() {
      if (isScoop) return scoopAngle;
      let sum = 0;
      for (const f of fingers) sum += getFingerAngle(f);
      return sum / fingers.length;
    }
    const stateEl = document.querySelector('#state');
    const scoreEl = document.querySelector('#score');
    const keys = new Set();

    let state = 'idle';
    let phaseTime = 0;
    let targetX = 0;
    let targetZ = 0;
    let fingerAngle = openAngle; // measured physical hinge angle
    let fingerTarget = openAngle;
    let score = 0;

    const labels = {
      idle: 'READY',
      preopen: 'OPEN',
      descending: 'DOWN',
      settling: 'SETTLE',
      closing: 'GRAB',
      squeezing: 'SQUEEZE',
      raising: 'UP',
      carrying: 'CARRY',
      releasing: 'RELEASE',
    };

    function setState(next) {
      state = next;
      phaseTime = 0;
      stateEl.textContent = labels[next] ?? next.toUpperCase();
    }

    function triggerArm() {
      if (state === 'idle') {
        fingerTarget = releaseAngle;
        setState('preopen');
      } else if (state === 'carrying') {
        fingerTarget = releaseAngle;
        setState('releasing');
      }
    }

    addEventListener('keydown', (e) => {
      if (e.target.closest('select, button, input, textarea')) return;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      if (autoMode) return;
      keys.add(e.code);
      if (e.code === 'Space' && !e.repeat) triggerArm();
    });
    addEventListener('keyup', (e) => {
      if (autoMode) return;
      keys.delete(e.code);
    });

    function moveToward(current, target, speed, dt) {
      const delta = target - current;
      return Math.abs(delta) <= speed * dt ? target : current + Math.sign(delta) * speed * dt;
    }

    function moveHub(dt) {
      const canDrive = state === 'idle' || state === 'carrying';
      if (canDrive) {
        const speed = state === 'carrying' ? 2.2 : 3.1;
        let dx = 0;
        let dz = 0;
        if (keys.has('KeyA') || keys.has('ArrowLeft')) dx -= 1;
        if (keys.has('KeyD') || keys.has('ArrowRight')) dx += 1;
        if (keys.has('KeyW') || keys.has('ArrowUp')) dz -= 1;
        if (keys.has('KeyS') || keys.has('ArrowDown')) dz += 1;
        const len = Math.hypot(dx, dz) || 1;
        targetX += dx / len * speed * dt;
        targetZ += dz / len * speed * dt;
        targetX = THREE.MathUtils.clamp(targetX, -4.15, 4.15);
        targetZ = THREE.MathUtils.clamp(targetZ, -3.15, 3.15);
      }

      let desiredY = topY;
      if (['descending', 'settling', 'closing', 'squeezing'].includes(state)) desiredY = bottomY;

      const oldX = hubBody.position.x;
      const oldY = hubBody.position.y;
      const oldZ = hubBody.position.z;
      const x = moveToward(oldX, targetX, canDrive ? 3.8 : 2.2, dt);
      const z = moveToward(oldZ, targetZ, canDrive ? 3.8 : 2.2, dt);
      const ySpeed = state === 'raising' ? 1.15 : 1.8;
      const y = moveToward(oldY, desiredY, ySpeed, dt);

      hubBody.position.set(x, y, z);
      hubBody.velocity.set(
        (x - oldX) / Math.max(dt, 1e-5),
        (y - oldY) / Math.max(dt, 1e-5),
        (z - oldZ) / Math.max(dt, 1e-5)
      );
      rememberKinematicTarget(hubBody);

      bridge.position.x = x;
      carriage.position.set(x, 6.9, z);
      hubMesh.position.set(x, y, z);

      const cableLength = Math.max(0.35, 6.74 - y);
      cable.scale.y = cableLength;
      cable.position.set(x, 6.74 - cableLength / 2, z);
    }

    function animateFingers(dt) {
      // Drive the actual hinge motors.  No finger position or quaternion is ever
      // teleported here: cannon-es constraints + contacts determine the result.
      // A blocked finger therefore stops against the prize while the motor keeps
      // applying a finite clamping torque, just like a real crane claw.
      fingerAngle = getAverageFingerAngle();

      for (const f of fingers) {
        const current = getFingerAngle(f);
        const error = normalizedAngle(fingerTarget - current);

        // Retract gently during release to reduce the pads' sideways impulse.
        // Unloaded opening and all closing speeds remain unchanged.
        const openSpeed = state === 'releasing' ? 1.05 : 2.15;
        const maxSpeed = error >= 0 ? openSpeed : 1.05;
        // HingeConstraint's motor target is defined as wA - wB along the
        // hinge axis.  The hub (A) is fixed rotationally, so body B must receive
        // the opposite signed target velocity to move toward +error.
        const motorSpeed = -THREE.MathUtils.clamp(error * 7.0, -maxSpeed, maxSpeed);
        f.hinge.setMotorSpeed(motorSpeed);

        // Keep every finger awake while the mechanism is active. Sleeping dynamic
        // fingers are undesirable because the motor is an actively powered joint.
        f.body.wakeUp();
      }
    }

    function updateSequence(dt) {
      phaseTime += dt;
      if (isScoop) {
        if (state === 'preopen' && scoopAngle === scoopInsertAngle) setState('descending');
        else if (state === 'descending' && Math.abs(hubBody.position.y - bottomY) < 0.015) setState('settling');
        else if (state === 'settling' && phaseTime > 0.18) setState('closing');
        else if (state === 'closing' && scoopAngle === 0) setState('squeezing');
        else if (state === 'squeezing' && phaseTime > 0.25) setState('raising');
        else if (state === 'raising' && Math.abs(hubBody.position.y - topY) < 0.015) setState('carrying');
        else if (state === 'releasing' && phaseTime > 1.2) setState('idle');
        return;
      }

      if (state === 'preopen') {
        fingerTarget = releaseAngle;
        if (phaseTime > 0.28 && Math.abs(fingerAngle - releaseAngle) < 0.03) {
          setState('descending');
        }
      } else if (state === 'descending') {
        fingerTarget = openAngle;
        if (Math.abs(hubBody.position.y - bottomY) < 0.015) {
          setState('settling');
        }
      } else if (state === 'settling') {
        // Real machines pause briefly before energising the claw.
        if (phaseTime > 0.18) {
          fingerTarget = closedAngle;
          setState('closing');
        }
      } else if (state === 'closing') {
        fingerTarget = closedAngle;
        if (phaseTime > 0.72 || Math.abs(fingerAngle - closedAngle) < 0.015) {
          setState('squeezing');
        }
      } else if (state === 'squeezing') {
        fingerTarget = closedAngle;
        if (phaseTime > 0.45) setState('raising');
      } else if (state === 'raising') {
        fingerTarget = closedAngle;
        if (Math.abs(hubBody.position.y - topY) < 0.015) setState('carrying');
      } else if (state === 'carrying') {
        fingerTarget = closedAngle;
      } else if (state === 'releasing') {
        fingerTarget = releaseAngle;
        if (phaseTime > 0.55 && Math.abs(fingerAngle - releaseAngle) < 0.03) {
          fingerTarget = openAngle;
          setState('idle');
        }
      } else {
        fingerTarget = openAngle;
      }
    }

    // cannon-es' Coulomb friction alone is numerically fragile for a claw that is
    // driven kinematically: once the prize is exactly tangent to the pads, the solver
    // can lose the clamp preload that a real motor would keep applying.  We therefore
    // add a compliant (spring) grip only after TWO OR MORE different fingers are in
    // actual contact with the same prize.  It is not a magnetic nearest-object grab:
    // a missed grab still misses, and the spring can slip/break if the prize lags too far.
    let grip = null;

    function collectFingerContacts() {
      const result = new Map();
      for (const contact of world.contacts) {
        if (contact.enabled === false) continue;

        let fingerIndex = null;
        let prize = null;
        if (fingerIndexByBody.has(contact.bi) && prizeByBody.has(contact.bj)) {
          fingerIndex = fingerIndexByBody.get(contact.bi);
          prize = prizeByBody.get(contact.bj);
        } else if (fingerIndexByBody.has(contact.bj) && prizeByBody.has(contact.bi)) {
          fingerIndex = fingerIndexByBody.get(contact.bj);
          prize = prizeByBody.get(contact.bi);
        }
        if (fingerIndex === null || !prize) continue;

        let set = result.get(prize);
        if (!set) result.set(prize, set = new Set());
        set.add(fingerIndex);
      }
      return result;
    }

    function tryAcquireGrip() {
      if (isScoop || grip || !['closing', 'squeezing', 'raising'].includes(state)) return;
      if (fingerAngle > 0.64) return;

      const contacts = collectFingerContacts();
      let best = null;
      let bestScore = -Infinity;

      for (const [prize, fingerSet] of contacts) {
        if (fingerSet.size < 2) continue;

        const dx = prize.body.position.x - hubBody.position.x;
        const dy = prize.body.position.y - hubBody.position.y;
        const dz = prize.body.position.z - hubBody.position.z;
        const radial = Math.hypot(dx, dz);

        // Only objects geometrically enclosed by the claw are eligible.
        if (radial > 0.68 || dy > -0.45 || dy < -1.55) continue;

        const score = fingerSet.size * 10 - radial;
        if (score > bestScore) {
          bestScore = score;
          best = prize;
        }
      }

      if (!best) return;

      const localAnchorA = new CANNON.Vec3(
        best.body.position.x - hubBody.position.x,
        best.body.position.y - hubBody.position.y,
        best.body.position.z - hubBody.position.z
      );

      const spring = new CANNON.Spring(hubBody, best.body, {
        localAnchorA,
        localAnchorB: new CANNON.Vec3(0, 0, 0),
        restLength: 0,
        stiffness: 190,
        damping: 12,
      });

      best.body.wakeUp();
      grip = { prize: best, spring, localAnchorA };
    }

    function releaseGrip() {
      grip = null;
    }

    function applyGripAssist() {
      if (!grip) return;

      if (state === 'releasing' || state === 'idle' || fingerAngle > 0.70) {
        releaseGrip();
        return;
      }

      // hubBody never rotates, so its local anchor transforms by translation only.
      const targetX = hubBody.position.x + grip.localAnchorA.x;
      const targetY = hubBody.position.y + grip.localAnchorA.y;
      const targetZ = hubBody.position.z + grip.localAnchorA.z;
      const dx = grip.prize.body.position.x - targetX;
      const dy = grip.prize.body.position.y - targetY;
      const dz = grip.prize.body.position.z - targetZ;
      const error = Math.hypot(dx, dy, dz);

      // A sufficiently large lag means the prize slipped out of the pads.
      if (error > 0.34) {
        releaseGrip();
        return;
      }

      grip.spring.applyForce();
    }

    function updateScore() {
      for (const p of prizes) {
        if (p.scored) continue;
        const { x, y, z } = p.body.position;
        const inTray = x > 2.45 && x < 4.65 && z > 1.9 && z < 3.75 && y < 0.95;
        if (inTray && p.body.velocity.length() < 1.2) {
          p.scored = true;
          score += 1;
          scoreEl.textContent = String(score);
        }
      }
    }

    // ---- Clef auto-operation adapter -------------------------------------
    // Exposes a read-only observation of the physical state, a frame capture,
    // and tick-accurate action execution. Physics rules themselves (moveHub,
    // updateSequence, grip, scoring) are untouched; this layer only drives the
    // same `keys` set and `triggerArm()` entry point that manual input uses,
    // and gates how many fixed physicsTicks the main loop may run per call.
    let autoMode = false;
    let autoWaiting = false;
    let pendingAutoStep = null;
    const AUTO_MECHANISM_MAX_TICKS = 3600; // 30s of simulated time

    function waitTicks(ticksTotal) {
      return new Promise((resolve, reject) => {
        pendingAutoStep = { kind: 'fixed', ticksTotal, ticksDone: 0, finished: false, resolve, reject };
        autoWaiting = false;
      });
    }

    function waitForPhase(targetPhases, maxTicks) {
      return new Promise((resolve, reject) => {
        pendingAutoStep = {
          kind: 'phase-wait',
          targetPhases,
          maxTicks,
          ticksDone: 0,
          finished: false,
          resolve,
          reject,
        };
        autoWaiting = false;
      });
    }

    // Returns true once the pending step is finished (success or timeout), so
    // the caller can stop ticking for the remainder of this animation frame.
    function evaluatePendingAutoStep() {
      const step = pendingAutoStep;
      if (step.kind === 'fixed') {
        if (step.ticksDone >= step.ticksTotal) step.finished = true;
      } else if (step.kind === 'phase-wait') {
        if (step.targetPhases.includes(state)) {
          step.finished = true;
        } else if (step.ticksDone >= step.maxTicks) {
          step.finished = true;
          step.error = `timeout waiting for phase ${step.targetPhases.join('/')} (still ${state})`;
        }
      }
      return step.finished === true;
    }

    function finalizePendingAutoStep() {
      const step = pendingAutoStep;
      pendingAutoStep = null;
      autoWaiting = true;
      accumulator = 0;
      if (step.error) step.reject(new Error(step.error));
      else step.resolve();
    }

    function observe() {
      return {
        phase: state,
        phase_time: phaseTime,
        score,
        claw: {
          position: { x: hubBody.position.x, y: hubBody.position.y, z: hubBody.position.z },
          target: { x: targetX, z: targetZ },
          finger_angle: fingerAngle,
          held_prize_id: heldPrize() ? prizes.indexOf(heldPrize()) : null,
        },
        prizes: prizes.map((p, id) => ({
          id,
          position: { x: p.body.position.x, y: p.body.position.y, z: p.body.position.z },
          velocity: { x: p.body.velocity.x, y: p.body.velocity.y, z: p.body.velocity.z },
          shape: p.shape,
          scored: p.scored,
        })),
        bounds: { x: [-4.15, 4.15], z: [-3.15, 3.15] },
        speeds: { idle: 3.1, carrying: 2.2 },
        tray: {
          center: { x: 3.55, z: 2.8 },
          score_bounds: { x: [2.45, 4.65], z: [1.9, 3.75], y_max: 0.95, speed_max: 1.2 },
        },
      };
    }
    // Hides the physical hardware that would otherwise sit directly over a
    // held/targeted prize in a straight-down shot (hub, fingers, cable,
    // bridge, carriage all run near x=hub,z=hub regardless of y), and shows
    // the flat claw-position marker instead. Visual-only: no physics body is
    // touched, so moveHub/updateSequence/grip are unaffected.
    function setArmPartsVisible(visible) {
      hubMesh.visible = visible;
      carriage.visible = visible;
      cable.visible = visible;
      bridge.visible = visible;
      for (const f of fingers) f.mesh.visible = visible;
      if (scoopMesh) scoopMesh.visible = visible;
    }

    function hideArmForTopDownCapture() {
      setArmPartsVisible(false);
      clawMarker.position.set(hubBody.position.x, 0.03, hubBody.position.z);
      clawMarker.visible = true;
    }

    function restoreArmAfterTopDownCapture() {
      setArmPartsVisible(true);
      clawMarker.visible = false;
    }

    function renderTopDownFrame() {
      updateTopDownFrustum();
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, innerWidth, innerHeight);
      renderer.render(scene, topDownCamera);
    }

    // Minimal 2D overlay burned into the captured JPEG only (never the live
    // canvas): a 'TOP VIEW' badge so the model doesn't assume this frame
    // uses the same screen-direction mapping as the oblique view.
    function drawTopDownOverlay(ctx, w, h) {
      const fontPx = Math.max(14, Math.round(Math.min(w, h) * 0.045));
      ctx.save();
      ctx.font = `bold ${fontPx}px sans-serif`;
      const text = 'TOP VIEW';
      const textW = ctx.measureText(text).width;
      const padX = Math.round(fontPx * 0.5);
      const padY = Math.round(fontPx * 0.35);
      const boxX = Math.round(w * 0.02);
      const boxY = Math.round(h * 0.02);
      ctx.fillStyle = 'rgba(10, 12, 18, 0.82)';
      ctx.fillRect(boxX, boxY, textW + padX * 2, fontPx + padY * 2);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(text, boxX + padX, boxY + padY);
      ctx.restore();
    }

    // Renders the oblique stage camera into the full canvas — the on-screen
    // game view. capture()'s separate top-down pass (renderTopDownFrame())
    // uses its own camera and never reads this function's output.
    function renderScene() {
      renderer.setViewport(0, 0, innerWidth, innerHeight);
      renderer.render(scene, camera);
    }

    function capture() {
      // User-visible canvas keeps the normal oblique render.
      renderScene();

      let dataUrl;
      try {
        hideArmForTopDownCapture();
        renderTopDownFrame();

        const src = renderer.domElement;
        const scale = Math.min(1, 768 / Math.max(src.width, src.height));
        const w = Math.max(1, Math.round(src.width * scale));
        const h = Math.max(1, Math.round(src.height * scale));
        const out = document.createElement('canvas');
        out.width = w;
        out.height = h;
        const octx = out.getContext('2d');
        octx.drawImage(src, 0, 0, w, h);
        drawTopDownOverlay(octx, w, h);
        dataUrl = out.toDataURL('image/jpeg', 0.8);
      } finally {
        // Always restore the arm meshes and the oblique render so a capture
        // failure never leaves hardware hidden or a top-down frame on screen.
        restoreArmAfterTopDownCapture();
        renderScene();
      }
      return dataUrl;
    }

    async function beginAuto() {
      autoMode = true;
      keys.clear();
      if (state === 'idle' || state === 'carrying') {
        autoWaiting = true;
        accumulator = 0;
      } else {
        await waitForPhase(['idle', 'carrying'], AUTO_MECHANISM_MAX_TICKS);
      }
    }

    const AUTO_DIRECTION_KEYS = { left: 'KeyA', right: 'KeyD', forward: 'KeyW', backward: 'KeyS' };

    async function execute(action, step) {
      if (!autoMode) throw new Error('execute() called outside auto mode');

      if (action === 'grab') {
        if (state !== 'idle') throw new Error(`cannot grab in phase ${state}`);
        triggerArm();
        await waitForPhase(['carrying'], AUTO_MECHANISM_MAX_TICKS);
        await waitTicks(360);
        return;
      }
      if (action === 'release') {
        if (state !== 'carrying') throw new Error(`cannot release in phase ${state}`);
        triggerArm();
        await waitForPhase(['idle'], AUTO_MECHANISM_MAX_TICKS);
        await waitTicks(360);
        return;
      }
      if (action === 'wait') {
        await waitTicks(step.ticks);
        return;
      }
      const code = AUTO_DIRECTION_KEYS[action];
      if (!code) throw new Error(`unknown action ${action}`);
      keys.add(code);
      try {
        await waitTicks(step.ticks);
      } finally {
        keys.delete(code);
      }
    }

    function endAuto() {
      if (pendingAutoStep) {
        const step = pendingAutoStep;
        pendingAutoStep = null;
        step.reject(new Error('auto ended'));
      }
      keys.clear();
      autoMode = false;
      autoWaiting = false;
      accumulator = 0;
    }

    const clock = new THREE.Clock();
    // 120 Hz control/physics ticks keep the fast moving pads from stepping through
    // small prizes.  Each tick updates the claw by only a few millimetres.
    const fixedTimeStep = 1 / 120;
    let accumulator = 0;

    function physicsTick(dt) {
      updateSequence(dt);
      moveHub(dt);
      animateFingers(dt);
      updateScoop(dt);
      applyGripAssist();

      // Exactly one physics integration per control tick.  Kinematic bodies are
      // restored afterwards because their pose was already advanced explicitly.
      world.step(dt);
      restoreKinematicTargets();
      fingerAngle = getAverageFingerAngle();
      tryAcquireGrip();
      updateScoopSupport();
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (autoMode && autoWaiting) {
        accumulator = 0;
      } else {
        accumulator += dt;

        // Bound catch-up work after a suspended/background tab.
        let steps = 0;
        while (accumulator >= fixedTimeStep && steps < 8) {
          physicsTick(fixedTimeStep);
          accumulator -= fixedTimeStep;
          steps += 1;
          if (autoMode && pendingAutoStep) {
            pendingAutoStep.ticksDone += 1;
            if (evaluatePendingAutoStep()) break;
          }
        }
        if (steps === 8) accumulator = 0;
      }

      for (const { body, mesh } of dynamicObjects) {
        mesh.position.copy(body.position);
        mesh.quaternion.copy(body.quaternion);
      }

      // Keep every visible claw part on the exact physics pose.
      hubMesh.position.copy(hubBody.position);
      for (const f of fingers) {
        f.mesh.position.copy(f.body.position);
        f.mesh.quaternion.copy(f.body.quaternion);
      }

      const cableLength = Math.max(0.35, 6.74 - hubBody.position.y);
      cable.scale.y = cableLength;
      cable.position.set(hubBody.position.x, 6.74 - cableLength / 2, hubBody.position.z);
      bridge.position.x = hubBody.position.x;
      carriage.position.set(hubBody.position.x, 6.9, hubBody.position.z);

      updateScore();
      stateEl.textContent = `${labels[state] ?? state.toUpperCase()}${heldPrize() ? ' • HOLD' : ''}`;
      renderScene();

      if (autoMode && pendingAutoStep && pendingAutoStep.finished) {
        finalizePendingAutoStep();
      }
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    mountClefDemo({ observe, capture, beginAuto, execute, endAuto, armType });
  </script>
</body>
</html>
