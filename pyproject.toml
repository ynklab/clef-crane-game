[project]
name = "clef-crane-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "transformers==5.10.2",
    "accelerate==1.15.0",
    "huggingface-hub>=1.5,<2",
    "safetensors>=0.4.3",
    "Pillow>=10.0.1,<=15.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
